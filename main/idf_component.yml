## IDF Component Manager Manifest File
## This file is used by the IDF Component Manager to fetch managed components
## See: https://docs.espressif.com/projects/idf-component-manager/

dependencies:
  # USB Host CDC-ACM component (required for USB CDC Host functionality)
  usb_host_cdc_acm: "2.*"
  # Button component (required for button GPIO functionality)
  espressif/button: "^4.1.3"
  # mDNS component (required for mDNS service)
  espressif/mdns: "^1.8.2"
  idf: ">=4.4"
